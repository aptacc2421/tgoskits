<!DOCTYPE html>
<html lang="zh-CN" data-theme="stage">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AxVisor 控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
/* ============================================================
   AxVisor 控制台 — v4
   立场：这不是仪表盘，是一个正在运行的系统的舞台。
   去掉实心色块。用光（渐变、辉光、流动的前沿）表达占用。
   用流式输出表达"活着"。用大排版承载主张。
   ============================================================ */

/* ---------- 主题 ---------- */
[data-theme='stage'] {
  --bg: oklch(12% 0.006 265);
  --bg-2: oklch(15% 0.007 265);
  --surface: oklch(17.5% 0.008 265);
  --surface-2: oklch(22% 0.009 265);
  --line: oklch(29% 0.010 265);
  --line-soft: oklch(21% 0.008 265);

  --ink: oklch(97% 0.002 265);
  --ink-2: oklch(78% 0.005 265);
  --ink-3: oklch(58% 0.008 265);
  --ink-4: oklch(42% 0.009 265);

  --accent: oklch(82% 0.13 84);
  --accent-2: oklch(72% 0.15 62);
  --accent-glow: oklch(82% 0.13 84 / 0.42);
  --accent-ink: oklch(14% 0.03 84);

  --signal: oklch(78% 0.08 175);
  --signal-glow: oklch(78% 0.08 175 / 0.35);
  --alert: oklch(64% 0.19 25);

  --glow: oklch(82% 0.13 84 / 0.055);
  --sheen: oklch(97% 0.002 265 / 0.09);
}

[data-theme='daylight'] {
  --bg: oklch(98% 0.003 265);
  --bg-2: oklch(96% 0.003 265);
  --surface: oklch(99% 0.002 265);
  --surface-2: oklch(93% 0.004 265);
  --line: oklch(86% 0.006 265);
  --line-soft: oklch(91% 0.004 265);

  --ink: oklch(20% 0.008 265);
  --ink-2: oklch(36% 0.009 265);
  --ink-3: oklch(50% 0.010 265);
  --ink-4: oklch(64% 0.009 265);

  --accent: oklch(52% 0.19 30);
  --accent-2: oklch(58% 0.16 45);
  --accent-glow: oklch(52% 0.19 30 / 0.22);
  --accent-ink: oklch(99% 0.002 265);

  --signal: oklch(48% 0.08 165);
  --signal-glow: oklch(48% 0.08 165 / 0.18);
  --alert: oklch(48% 0.19 25);

  --glow: oklch(52% 0.19 30 / 0.05);
  --sheen: oklch(20% 0.008 265 / 0.05);
}

[data-theme='phosphor'] {
  --bg: oklch(13% 0.010 165);
  --bg-2: oklch(16% 0.011 165);
  --surface: oklch(19% 0.012 165);
  --surface-2: oklch(24% 0.013 165);
  --line: oklch(31% 0.014 165);
  --line-soft: oklch(23% 0.012 165);

  --ink: oklch(95% 0.012 165);
  --ink-2: oklch(80% 0.015 165);
  --ink-3: oklch(60% 0.016 165);
  --ink-4: oklch(44% 0.014 165);

  --accent: oklch(82% 0.15 148);
  --accent-2: oklch(74% 0.14 165);
  --accent-glow: oklch(82% 0.15 148 / 0.40);
  --accent-ink: oklch(14% 0.03 148);

  --signal: oklch(82% 0.11 148);
  --signal-glow: oklch(82% 0.11 148 / 0.32);
  --alert: oklch(66% 0.19 25);

  --glow: oklch(82% 0.15 148 / 0.05);
  --sheen: oklch(95% 0.012 165 / 0.08);
}

/* ---------- token ---------- */
:root {
  --dur-quick: 150ms;
  --dur-fast: 250ms;
  --dur-slow: 420ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  --font-ui: 'Archivo', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --topbar-h: 52px;
  --statusbar-h: 34px;
}

* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
}

/* 舞台聚光灯：一处柔和的径向光，不是紫蓝渐变，不是粒子 */
body::before {
  content: '';
  position: fixed;
  top: -34vh;
  left: 50%;
  transform: translateX(-50%);
  width: 130vw;
  height: 78vh;
  background: radial-gradient(ellipse 50% 60% at 50% 50%, var(--glow), transparent 72%);
  pointer-events: none;
  z-index: 0;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
input {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  outline: 0;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 3px;
}
.mono {
  font-family: var(--font-mono);
}

.label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: relative;
  z-index: 3;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 22px;
  border-bottom: 1px solid var(--line-soft);
  background: color-mix(in oklab, var(--bg) 78%, transparent);
  backdrop-filter: blur(12px);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 9px;
}
.brand-mark {
  width: 16px;
  height: 16px;
  align-self: center;
  color: var(--accent);
}
.brand-name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.22em;
}
.brand-ver {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
}
.topbar-mid {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 12px;
  color: var(--ink-3);
}
.topbar-mid .sep {
  color: var(--ink-4);
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 28px;
  padding: 0 11px;
  border-radius: 5px;
  font-size: 12px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  transition: background var(--dur-quick) var(--ease-out),
    color var(--dur-quick) var(--ease-out), border-color var(--dur-quick) var(--ease-out);
}
.btn:active {
  transform: scale(0.97);
}
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
  box-shadow: 0 0 22px -6px var(--accent-glow);
}

.theme-switch {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 5px;
  overflow: hidden;
}
.theme-switch button {
  padding: 0 9px;
  height: 28px;
  font-size: 11px;
  color: var(--ink-3);
  transition: background var(--dur-quick) var(--ease-out), color var(--dur-quick) var(--ease-out);
}
.theme-switch button.on {
  background: var(--surface-2);
  color: var(--ink);
}

/* ---------- 骨架 ---------- */
.shell {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 196px minmax(0, 1fr);
  height: calc(100vh - var(--topbar-h) - var(--statusbar-h));
}

.rail {
  border-right: 1px solid var(--line-soft);
  padding: 18px 10px;
  overflow-y: auto;
}
.rail-group {
  padding: 14px 8px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  height: 33px;
  padding: 0 10px;
  border-radius: 5px;
  font-size: 13px;
  color: var(--ink-2);
  transition: background var(--dur-quick) var(--ease-out), color var(--dur-quick) var(--ease-out);
}
.nav-item svg {
  color: var(--ink-3);
  transition: color var(--dur-quick) var(--ease-out);
}
.nav-item[aria-current='true'] {
  background: var(--surface);
  color: var(--ink);
}
.nav-item[aria-current='true'] svg {
  color: var(--accent);
}
.nav-count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
}

.workspace {
  overflow-y: auto;
  padding: 0;
}

/* ---------- 主张：大排版 ---------- */
.hero {
  padding: 38px 34px 30px;
  border-bottom: 1px solid var(--line-soft);
}

.hero-stmt {
  font-size: 46px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.14;
  margin: 0;
  max-width: none;
}
.hero-stmt .dim {
  color: var(--ink-3);
  font-weight: 400;
}
/* 渐变发光文字：不是紫蓝，是琥珀能量 */
.hero-stmt .num {
  font-family: var(--font-mono);
  font-weight: 500;
  background: linear-gradient(115deg, var(--accent) 20%, var(--accent-2) 85%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero-sub {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12.5px;
  color: var(--ink-3);
}
.hero-sub .k {
  font-family: var(--font-mono);
  color: var(--ink-2);
}

/* ---------- 主视觉：发光轨道（不再是方块） ---------- */
.stage {
  margin-top: 34px;
  padding: 24px 26px 22px;
  border-radius: 12px;
  border: 1px solid var(--line-soft);
  background:
    radial-gradient(ellipse 70% 130% at 50% -20%, var(--glow), transparent 70%),
    linear-gradient(180deg, var(--sheen), transparent 55%);
  box-shadow: 0 24px 60px -30px oklch(0% 0 0 / 0.55);
}

.stage-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 18px;
}
.stage-head .t {
  font-size: 12px;
  font-weight: 500;
}
.stage-head .m {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-3);
}
.stage-head .r {
  margin-left: auto;
  display: flex;
  gap: 22px;
}
.stage-head .r div {
  display: flex;
  align-items: baseline;
  gap: 7px;
}
.stage-head .r .n {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 500;
  line-height: 1;
}

/* 轨道本体 */
.track {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 5px;
}

.lane {
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: opacity var(--dur-fast) var(--ease-out);
}

/* 细长发光条，替代方块 */
.bar {
  height: 15px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  overflow: hidden;
  position: relative;
}

.lane.idle .bar {
  background: transparent;
  border-style: dashed;
  border-color: var(--line);
}

.bar i {
  display: block;
  height: 100%;
  border-radius: 7px;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  box-shadow: 0 0 22px -4px var(--accent-glow);
  position: relative;
  overflow: hidden;
}

/* 流动的前沿：能量在走，不是静止的色块 */
.bar i::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    100deg,
    transparent 20%,
    var(--sheen) 45%,
    var(--sheen) 55%,
    transparent 80%
  );
  background-size: 220% 100%;
  animation: sweep 2.6s linear infinite;
}

@keyframes sweep {
  from {
    background-position: 180% 0;
  }
  to {
    background-position: -80% 0;
  }
}

/* 分时共享：两条更细的光带 */
.lane.shared .bar {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 2px;
  height: 20px;
}
.lane.shared .bar i {
  height: auto;
  flex: 1;
  border-radius: 4px;
}
.lane.shared .bar i:nth-child(2) {
  background: linear-gradient(90deg, var(--signal), var(--accent-2));
  box-shadow: 0 0 14px -4px var(--signal-glow);
}

.lane-foot {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  padding: 0 1px;
}

.track.focusing .lane {
  opacity: 0.24;
}
.track.focusing .lane.lit {
  opacity: 1;
}
.lane.lit .bar {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent-glow), 0 0 20px -6px var(--accent-glow);
}

/* 内存：同样用光带 */
.memlane {
  display: flex;
  height: 11px;
  margin-top: 18px;
  border-radius: 6px;
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
}
.memlane i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  box-shadow: 0 0 14px -4px var(--accent-glow);
}
.memlane i:nth-child(2) {
  background: linear-gradient(90deg, var(--accent), var(--signal));
}
.memlane i:nth-child(3) {
  background: linear-gradient(90deg, var(--signal), var(--surface-2));
}
.stage-note {
  margin-top: 9px;
  font-size: 11.5px;
  color: var(--ink-3);
}
.stage-note .q {
  color: var(--ink-4);
}

/* ---------- 客户机列表 ---------- */
.section {
  padding: 26px 34px 34px;
}
.section-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 6px;
}
.section-head .title {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.section-head .count {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-4);
}

.rows {
  margin-top: 8px;
}
.row {
  display: grid;
  grid-template-columns: 128px 96px 150px 90px 100px 74px;
  align-items: center;
  gap: 16px;
  height: 48px;
  padding: 0 10px;
  margin: 0 -10px;
  border-radius: 6px;
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
  transition: background var(--dur-quick) var(--ease-out),
    box-shadow var(--dur-quick) var(--ease-out);
}
.row:last-child {
  border-bottom: 0;
}
.row .name {
  font-size: 13.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row .cell {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-2);
  white-space: nowrap;
}
.row .ops {
  display: flex;
  gap: 3px;
  justify-content: flex-end;
  opacity: 0;
  transition: opacity var(--dur-quick) var(--ease-out);
}
.row:hover .ops,
.row:focus-within .ops {
  opacity: 1;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 27px;
  height: 27px;
  border-radius: 5px;
  color: var(--ink-2);
  border: 1px solid transparent;
  transition: background var(--dur-quick) var(--ease-out),
    border-color var(--dur-quick) var(--ease-out), color var(--dur-quick) var(--ease-out);
}
.icon-btn:active {
  transform: scale(0.94);
}
.icon-btn.danger {
  color: var(--alert);
}

/* 状态：一个光点，不是徽章 */
.state {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--ink-2);
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ink-4);
  flex: none;
}
.state.running .dot {
  background: var(--signal);
  box-shadow: 0 0 10px 0 var(--signal-glow);
}
.state.running {
  color: var(--ink);
}
.state.failed .dot {
  background: var(--alert);
  box-shadow: 0 0 10px 0 oklch(64% 0.19 25 / 0.35);
}
.state.failed {
  color: var(--alert);
}

/* ---------- 底部状态条：流式事件 ---------- */
.statusbar {
  position: relative;
  z-index: 3;
  height: var(--statusbar-h);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 22px;
  border-top: 1px solid var(--line-soft);
  background: var(--bg-2);
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-3);
}
.statusbar .live {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--ink-2);
}
.statusbar .live .dot {
  width: 6px;
  height: 6px;
  background: var(--signal);
  box-shadow: 0 0 9px 0 var(--signal-glow);
  animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.42;
  }
}
.statusbar .ev {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.statusbar .ev .ts {
  color: var(--ink-4);
  margin-right: 8px;
}
.statusbar .caret {
  display: inline-block;
  width: 6px;
  height: 12px;
  background: var(--accent);
  animation: blink 1.1s steps(1) infinite;
  vertical-align: -2px;
  margin-left: 3px;
}
@keyframes blink {
  0%,
  49% {
    opacity: 1;
  }
  50%,
  100% {
    opacity: 0;
  }
}
.statusbar .right {
  margin-left: auto;
  display: flex;
  gap: 16px;
  color: var(--ink-4);
}

/* ---------- 抽屉 ---------- */
.scrim {
  position: fixed;
  inset: 0;
  background: oklch(0% 0 0 / 0.55);
  opacity: 0;
  transition: opacity var(--dur-fast) var(--ease-out);
  z-index: 40;
}
.scrim.in {
  opacity: 1;
}
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 404px;
  max-width: 92vw;
  background: var(--bg-2);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform var(--dur-slow) var(--ease-drawer);
  z-index: 41;
  box-shadow: -30px 0 60px -30px oklch(0% 0 0 / 0.6);
}
.drawer.in {
  transform: translateX(0);
}
.drawer-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--line-soft);
}
.drawer-head .t {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.drawer-head .s {
  margin-top: 6px;
}
.drawer-body {
  padding: 20px 24px 30px;
  overflow-y: auto;
}
.bignums {
  display: flex;
  gap: 34px;
  padding: 2px 0 20px;
}
.bignum .n {
  font-family: var(--font-mono);
  font-size: 34px;
  line-height: 1;
  font-weight: 500;
}
.bignum .k {
  margin-top: 8px;
}
.field {
  display: grid;
  grid-template-columns: 104px minmax(0, 1fr);
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13px;
}
.field:last-of-type {
  border-bottom: 0;
}
.field .k {
  color: var(--ink-3);
  font-size: 12.5px;
}
.field .v {
  font-family: var(--font-mono);
  font-size: 12.5px;
  word-break: break-all;
}
.pin-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.pin {
  width: 27px;
  height: 27px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  color: var(--ink-3);
}
.pin.on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 0 14px -4px var(--accent-glow);
}
.notice {
  margin-top: 18px;
  padding: 12px 14px;
  border-left: 2px solid var(--alert);
  background: var(--surface);
  font-size: 12.5px;
  color: var(--ink-2);
}

/* ---------- 通用面板 ---------- */
.pane {
  padding: 34px;
  max-width: 920px;
}
.pane h2 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.015em;
}
.pane .sub {
  font-size: 12.5px;
  color: var(--ink-3);
  margin-bottom: 24px;
}
.kv {
  display: grid;
  grid-template-columns: 168px minmax(0, 1fr);
  gap: 14px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13px;
}
.kv .k {
  color: var(--ink-3);
  font-size: 12.5px;
}
.kv .v {
  font-family: var(--font-mono);
  font-size: 12.5px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.chip {
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-2);
}

/* 终端：流式是这个产品的本来面目 */
.term {
  height: 100%;
  display: flex;
  flex-direction: column;
}
.term-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 34px;
  border-bottom: 1px solid var(--line-soft);
}
.term-head .t {
  font-size: 15px;
  font-weight: 500;
}
.term-head .m {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-3);
}
.term-body {
  flex: 1;
  overflow-y: auto;
  padding: 22px 34px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.8;
  color: var(--ink-2);
}
.term-body .ts {
  color: var(--ink-4);
  margin-right: 12px;
}
.term-body .hi {
  color: var(--ink);
}
.term-body .ok {
  color: var(--signal);
}
.term-line {
  animation: lineIn var(--dur-fast) var(--ease-out) both;
}
@keyframes lineIn {
  from {
    opacity: 0;
    transform: translateY(3px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* 文件传输 */
.xfer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 78px 96px;
  align-items: center;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line-soft);
}
.xfer .bar {
  height: 5px;
  border-radius: 3px;
  background: var(--surface-2);
  overflow: hidden;
  margin-top: 8px;
}
.xfer .bar i {
  display: block;
  height: 100%;
  background: var(--ink-3);
  transition: width var(--dur-slow) var(--ease-out);
}
.xfer.active .bar i {
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  box-shadow: 0 0 12px -3px var(--accent-glow);
}
.xfer .pct,
.xfer .st {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-3);
  text-align: right;
}

/* 命令面板：键盘触发，无入场动画 */
.cmdk-wrap {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  justify-content: center;
  padding-top: 15vh;
  background: oklch(0% 0 0 / 0.6);
  backdrop-filter: blur(3px);
}
.cmdk {
  width: 540px;
  max-width: 92vw;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  align-self: flex-start;
  box-shadow: 0 30px 70px -20px oklch(0% 0 0 / 0.7);
}
.cmdk input {
  width: 100%;
  height: 48px;
  padding: 0 18px;
  font-size: 14px;
  border-bottom: 1px solid var(--line-soft);
}
.cmdk-list {
  max-height: 330px;
  overflow-y: auto;
  padding: 6px;
}
.cmdk-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  height: 36px;
  padding: 0 11px;
  border-radius: 5px;
  font-size: 13px;
  color: var(--ink-2);
  text-align: left;
}
.cmdk-item svg {
  color: var(--ink-3);
}
.cmdk-item.on {
  background: var(--surface-2);
  color: var(--ink);
}
.cmdk-item .hint {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
}
.cmdk-empty {
  padding: 24px 14px;
  font-size: 12.5px;
  color: var(--ink-4);
  text-align: center;
}

/* 进场：数字与区块错开浮现 */
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.rise {
  animation: rise var(--dur-slow) var(--ease-out) both;
  animation-delay: calc(var(--i, 0) * 55ms);
}

/* ---------- 交互限定 ---------- */
@media (hover: hover) and (pointer: fine) {
  .btn:hover {
    background: var(--surface);
    color: var(--ink);
  }
  .btn-primary:hover {
    background: var(--accent);
    color: var(--accent-ink);
    filter: brightness(1.07);
  }
  .theme-switch button:hover {
    background: var(--surface);
    color: var(--ink-2);
  }
  .nav-item:hover {
    background: var(--surface);
    color: var(--ink);
  }
  .row:hover {
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line-soft);
  }
  .icon-btn:hover {
    background: var(--surface-2);
    border-color: var(--line);
    color: var(--ink);
  }
  .icon-btn.danger:hover {
    color: var(--alert);
    border-color: var(--alert);
  }
  .cmdk-item:hover {
    background: var(--surface);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (max-width: 960px) {
  .shell {
    grid-template-columns: 62px minmax(0, 1fr);
  }
  .nav-item span,
  .nav-count {
    display: none;
  }
  .hero-stmt {
    font-size: 26px;
  }
  .row {
    grid-template-columns: minmax(0, 1fr) 92px;
  }
  .row .cell.cpus,
  .row .cell.mono,
  .row .ops {
    display: none;
  }
  .act {
    grid-template-columns: minmax(0, 1fr) 88px;
  }
  .act-meta,
  .act-rate {
    display: none;
  }
  .track {
    grid-auto-columns: 34px;
    grid-auto-flow: row;
    grid-template-columns: repeat(4, 34px);
  }
}

/* ---------- 正在执行：VM-Entry 脉冲 ---------- */
.act-stage {
  margin-top: 26px;
}

.acts {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.act {
  display: grid;
  grid-template-columns: 156px 210px minmax(0, 1fr) 88px 92px;
  align-items: center;
  gap: 14px;
  height: 38px;
  padding: 0 4px;
  border-radius: 6px;
  transition: background var(--dur-quick) var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .act:hover {
    background: var(--surface-2);
  }
}

.act-name {
  font-size: 13.5px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.act-meta {
  font-size: 12px;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.act-meta .q {
  color: var(--ink-4);
}

.act-track {
  position: relative;
  height: 16px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  overflow: hidden;
}

.act.held .act-track {
  background: transparent;
  border-style: dashed;
}

.act-track .pulse {
  position: absolute;
  top: 2px;
  left: 0;
  width: 5px;
  height: 10px;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  box-shadow: 0 0 14px -2px var(--accent-glow);
  animation: entry-sweep var(--d, 1.1s) linear forwards;
}

@keyframes entry-sweep {
  from {
    transform: translateX(-8px);
    opacity: 0;
  }
  12% {
    opacity: 1;
  }
  78% {
    opacity: 1;
  }
  to {
    transform: translateX(var(--sweep-end, 999px));
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .act-track .pulse {
    animation: none;
    opacity: 0.9;
  }
}

.act-rate {
  font-size: 12px;
  color: var(--accent);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.act-count {
  font-size: 12px;
  color: var(--ink-2);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.act.held .act-rate,
.act.held .act-count {
  color: var(--ink-4);
}

.col-head {
  font-size: 10.5px;
  color: var(--ink-4);
  letter-spacing: 0.07em;
}

/* ---------- 整机余量：一条，不按核拆 ---------- */
.capacity {
  margin-top: 26px;
  padding: 16px 18px 14px;
  border-radius: 9px;
  border: 1px solid var(--line-soft);
  background: linear-gradient(180deg, var(--sheen), transparent 70%);
}

.cap-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.cap-head .t {
  font-size: 12.5px;
  color: var(--ink-2);
}

.cap-head .m {
  font-size: 11.5px;
  color: var(--ink-4);
}

.cap-right {
  margin-left: auto;
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.cap-right .n {
  font-family: var(--font-mono);
  font-size: 15px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.cap-right .of {
  font-size: 12px;
  color: var(--ink-4);
}

.cap-right .lb {
  font-size: 11px;
  color: var(--ink-4);
  margin-right: 8px;
}

.cap-bar {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 3px;
  margin-top: 12px;
}

.cap-bar i {
  height: 12px;
  border-radius: 3px;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
}

.cap-bar i.used {
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  border-color: transparent;
  box-shadow: 0 0 12px -4px var(--accent-glow);
}

.cap-bar i.shared {
  background: repeating-linear-gradient(
    -45deg,
    var(--accent) 0 4px,
    var(--accent-2) 4px 8px
  );
  border-color: transparent;
}

.cap-note {
  margin-top: 10px;
  font-size: 11.5px;
  color: var(--ink-3);
}

.cap-note .q {
  color: var(--ink-4);
}

/* ---------- 客户机卡片 ---------- */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
  gap: 12px;
}

.vm-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 15px 16px 14px;
  border-radius: 10px;
  border: 1px solid var(--line-soft);
  background: var(--surface);
  cursor: pointer;
  outline: none;
  transition: border-color var(--dur-quick) var(--ease-out),
    background var(--dur-quick) var(--ease-out),
    transform var(--dur-quick) var(--ease-out);
}

.vm-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 14px;
  bottom: 14px;
  width: 2px;
  border-radius: 2px;
  background: var(--line);
}

.vm-card.live::before {
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  box-shadow: 0 0 12px -2px var(--accent-glow);
}

@media (hover: hover) and (pointer: fine) {
  .vm-card:hover {
    border-color: var(--line);
    background: var(--surface-2);
  }
}

.vm-card:focus-visible {
  border-color: var(--accent);
}

.card-top {
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-os {
  margin-left: auto;
  font-size: 10.5px;
  color: var(--ink-4);
  letter-spacing: 0.05em;
}

.card-name {
  font-size: 15px;
  color: var(--ink);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-spec {
  font-size: 12.5px;
  color: var(--ink-3);
}

.card-spec b {
  font-weight: 500;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.card-spec .q {
  color: var(--ink-4);
  margin: 0 3px;
}

.card-pin {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
}

.card-ops {
  display: flex;
  gap: 6px;
  margin-top: 4px;
  opacity: 0;
  transform: translateY(2px);
  transition: opacity var(--dur-quick) var(--ease-out),
    transform var(--dur-quick) var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .vm-card:hover .card-ops,
  .vm-card:focus-within .card-ops {
    opacity: 1;
    transform: none;
  }
}

.mini {
  font-size: 11.5px;
  color: var(--ink-2);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: transparent;
}

.mini:hover {
  color: var(--ink);
  background: var(--surface-2);
}

.mini:active {
  transform: scale(0.97);
}

.vm-card.new {
  align-items: center;
  justify-content: center;
  border-style: dashed;
  background: transparent;
  color: var(--ink-4);
  min-height: 132px;
}

.new-plus {
  font-size: 22px;
  line-height: 1;
  color: var(--ink-3);
}

.new-label {
  font-size: 12px;
  margin-top: 6px;
}

/* ---------- 宿主机：按核密度带，核数自适应 ---------- */
.host-block {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--line-soft);
}

.block-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
}

.block-head .t {
  font-size: 13px;
  color: var(--ink-2);
}

.block-head .m {
  font-size: 11.5px;
  color: var(--ink-4);
}

.density {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 2px;
}

.density i {
  height: 34px;
  border-radius: 3px;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
}

.density i.used {
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  border-color: transparent;
}

.density i.shared {
  background: repeating-linear-gradient(
    -45deg,
    var(--accent) 0 4px,
    var(--accent-2) 4px 8px
  );
  border-color: transparent;
}

.block-note {
  margin-top: 10px;
  font-size: 11.5px;
  color: var(--ink-4);
  line-height: 1.6;
}

@media (max-width: 900px) {
  .card-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .card-ops {
    opacity: 1;
    transform: none;
  }
}

/* ---------- 新建客户机 ----------
   表单是这个产品的主操作，不是弹窗装饰：宽抽屉 + 底部常驻操作条，
   字段用 hairline 分行，强调色只给"创建并启动"。 */
.drawer.wide {
  width: 640px;
}
.drawer.create .drawer-head .s {
  font-size: 11.5px;
  color: var(--ink-4);
  font-family: var(--font-mono);
}

.block {
  padding-bottom: 18px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line-soft);
}
.block:last-of-type {
  border-bottom: 0;
  margin-bottom: 0;
}

.pool-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  background: var(--surface);
  margin-bottom: 7px;
  transition: border-color var(--dur-quick) var(--ease-out);
}
.pool-row:hover {
  border-color: var(--line);
}
.pool-main {
  flex: 1;
  min-width: 0;
}
.pool-name {
  font-size: 13px;
  font-weight: 500;
}
.pool-id {
  margin-left: 8px;
  font-size: 11px;
  color: var(--ink-4);
}
.pool-meta {
  margin-top: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mini.go {
  color: var(--accent);
  border-color: color-mix(in oklch, var(--accent) 40%, var(--line));
}
.f-file .mini {
  white-space: nowrap;
  flex-shrink: 0;
}

.ff {
  display: grid;
  grid-template-columns: 168px minmax(0, 1fr);
  gap: 14px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line-soft);
}
.ff:last-of-type {
  border-bottom: 0;
}
.ff-k {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-2);
  display: flex;
  align-items: baseline;
  gap: 7px;
  flex-wrap: wrap;
}
.ff-t {
  font-size: 10.5px;
  color: var(--ink-4);
}
.req,
.opt {
  font-family: var(--font-ui);
  font-size: 10.5px;
  padding: 1px 5px;
  border-radius: 3px;
}
.req {
  color: var(--accent);
  background: color-mix(in oklch, var(--accent) 14%, transparent);
}
.opt {
  color: var(--ink-4);
  background: var(--surface-2);
}
.ff-v .f-in {
  width: 100%;
  height: 30px;
  padding: 0 10px;
  border-radius: 5px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 12px;
  transition: border-color var(--dur-quick) var(--ease-out),
    box-shadow var(--dur-quick) var(--ease-out);
}
.ff-v .f-in:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 18%, transparent);
}
.f-file {
  display: flex;
  gap: 8px;
}
.ff-d {
  margin-top: 5px;
  font-size: 11.5px;
  color: var(--ink-4);
  line-height: 1.5;
}
.ff-w {
  font-size: 11.5px;
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ff-w:empty {
  display: none;
}
.ff-w .mini {
  font-family: var(--font-ui);
  white-space: nowrap;
}
.ff-w .warn {
  color: var(--alert);
}
.ff-w .ok {
  color: var(--signal);
}
.form-note {
  margin-top: 14px;
  font-size: 11.5px;
  color: var(--ink-4);
  line-height: 1.6;
}

.sheet-foot {
  border-top: 1px solid var(--line);
  padding: 13px 24px 15px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.foot-ops {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
}
.foot-ops .btn {
  height: 31px;
  padding: 0 15px;
}
.foot-err,
.foot-warn {
  font-size: 11.5px;
  line-height: 1.5;
}
.foot-err {
  color: var(--alert);
}
.foot-warn {
  color: var(--ink-3);
}

/* 选已就位文件 */
.picker-wrap {
  position: fixed;
  inset: 0;
  background: oklch(0% 0 0 / 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 60;
}
.picker {
  width: 460px;
  max-width: 92vw;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 24px 60px -24px oklch(0% 0 0 / 0.7);
}
.picker-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line-soft);
  font-family: var(--font-mono);
  font-size: 12px;
}
.picker-head .m {
  color: var(--ink-4);
  font-size: 11px;
}
.pick-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 16px;

    <script>
/* AxVisor 控制台 v6
 *
 * 设计立场（看过 E2B / Modal / Fly.io 首屏后修正）：
 *   这三家的首屏都没有实时遥测。主视觉是「一句价值主张 + 一个具体实体的快照」，
 *   指标只以少量、静态、产品级的大数字出现在中后段。
 *   所以本版把 hero 做成主张，把主视觉做成客户机本身（客户买的就是客户机），
 *   VM-Entry 这类内部计数退回抽屉，供排障者查看。
 *
 * CPU 拓扑不再按核拆成独立小图：核数一多必然碎，且客户不关心核拓扑。
 *   主视图只给一条整机余量；按核的密度带收进宿主机页，做成连续色块，
 *   宽度随核数自适应 —— 8 核与 128 核是同一条。
 *
 * 数据纪律：只呈现控制面真实导出的字段。
 *   VM  → id / name / status / cpu_num / memory_mb / vcpu_states[].phys_cpu_set
 *         guest_entry_count / guest_park_count
 *   host→ version / arch / platform / cpus / uptime / features / pool / 监听地址
 * 不呈现、也不估算：CPU 占用率、内存占用率、网络吞吐、块设备 IO、多 host。
 */

const PCPUS = 8;
const BOOT = Date.now() - (3 * 3600 + 42 * 60) * 1000;
const TICK_MS = 380;

const HOST = {
  version: '0.8.2',
  arch: 'x86_64',
  platform: 'x86_64-qemu-q35',
  cpus: PCPUS,
  web: 'http://10.0.2.15:8080',
  listen: '0.0.0.0:8080',
  features: ['fs', 'http-axum', 'browser-console', 'web-ui'],
  pool: ['/guest', 'AXVISOR_VM_DIRS'],
};

/* entry / park 是 guest_entry_count 与 guest_park_count 的实时读数，
 * 只在抽屉里出现；主视图不展示内部计数。 */
const VMS = [
  { id: 'vm-1', name: 'arceos-shell', os: 'ArceOS', status: 'Running', vcpus: 4, mem: 1.0, cpus: [0, 1, 2, 3], entry: 48213, park: 3, rate: 0, image: 'arceos-x86_64.img', cmdline: 'LOG=info' },
  { id: 'vm-2', name: 'linux-guest', os: 'Linux', status: 'Running', vcpus: 2, mem: 2.0, cpus: [4, 5], entry: 31904, park: 1, rate: 0, image: 'linux-x86_64.img', cmdline: 'console=ttyS0' },
  { id: 'vm-3', name: 'rtos-node', os: 'RTOS', status: 'Running', vcpus: 2, mem: 0.5, cpus: [0, 1], entry: 17440, park: 5, rate: 0, image: 'rtos-x86_64.img', cmdline: '' },
  { id: 'vm-4', name: 'net-peer', os: 'Linux', status: 'Stopped', vcpus: 2, mem: 0.5, cpus: [6, 7], entry: 0, park: 0, rate: 0, image: 'net-x86_64.img', cmdline: '' },
  { id: 'vm-5', name: 'blk-bench', os: 'Linux', status: 'Failed', vcpus: 1, mem: 4.0, cpus: [7], entry: 0, park: 0, rate: 0, image: 'bench-x86_64.img', cmdline: '', issue: 'duplicate-id' },
];

const STATE_CN = { Running: '运行中', Paused: '已暂停', Stopped: '已停止', Failed: '失败' };

const VIEWS = [
  { id: 'vms', label: '客户机', icon: 'i-server', count: () => VMS.length },
  { id: 'console', label: '网页控制台', icon: 'i-terminal' },
  { id: 'files', label: '文件传输', icon: 'i-file' },
  { id: 'shell', label: 'Shell', icon: 'i-shell' },
];
const SYS_VIEWS = [{ id: 'host', label: '宿主机', icon: 'i-cpu' }];

const TRANSFERS = [
  { name: 'rootfs.ext4', total: 268435456, done: 268435456, state: '完成' },
  { name: 'app.bin', total: 12582912, done: 7340032, state: '传输中' },
  { name: 'config.toml', total: 4096, done: 0, state: '排队' },
];

const BOOTLOG = [
  'Booting AxVisor 0.8.2 (x86_64-qemu-q35)',
  '  phys memory regions: 3',
  '  percpu areas: 8 cpus',
  'Initializing guest vm-1 "arceos-shell"',
  '  vcpu: 4  pinned: 0-3',
  '  memory: 1.000 GiB',
  'VMM setup done, entering guest',
  '[    0.112] ArceOS starting...',
  '[    0.118] axhal: x86_64 initialized',
  '[    0.124] axalloc: bitmap allocator ready',
  '[    0.131] axtask: 4 tasks spawned',
  '[    0.140] axfs: mounting ramfs at /',
  '[    0.152] shell: arceos shell ready',
];

/* 底部事件流只写控制面能真正观察到的现象 */
const EVENTS = [
  'vm-1 状态变更 → Running',
  'vm-2 vcpu 1 → VM-Entry',
  'vm-3 vcpu 0 parked：suspend wait',
  'registry：配置池 /guest 变更 1 项',
  'vm-2 状态变更 → Running',
  'vm-5 加载被拒：duplicate-id',
  'vm-1 vcpu 3 → VM-Exit (reason 12)',
  'vm-3 状态变更 → Running',
];

/* ---------- 创建客户机的数据来源 ----------
 * 三个来源全是控制面真实存在的读接口，字段与后端 `GET /api/vms/schema`
 * 逐字对齐；file 字段的"已就位"判定用的就是 `GET /api/vms/browse` 列出的文件，
 * 也就是 create 门与传输落盘读的同一个谓词。 */

/* `GET /api/vms/pool` — 只是候选，start 时才真正创建 */
const POOL = [
  { id: 6, name: 'nimbos-zephyr', path: '/guest/nimbos-zephyr.toml', source: '/guest', cpu_num: 2, memory_mb: 512, entry: '0x80200000' },
  { id: 7, name: 'linux-builder', path: '/guest/linux-builder.toml', source: '/guest', cpu_num: 4, memory_mb: 2048, entry: '0x80200000' },
];

/* `GET /api/vms/browse?path=/guest` — 文件字段只能选这里已经就位的文件 */
const GUEST_FILES = [
  '/guest/linux/linux-qemu',
  '/guest/linux/rootfs-x86_64-alpine.img',
  '/guest/arceos/arceos-x86_64.bin',
  '/guest/nimbos/nimbos-x86_64.bin',
];

/* `GET /api/vms/schema` — 表单字段集是后端模板的投影，不是界面自己列的 */
const SCHEMA = [
  { name: 'id', type: 'integer', required: true, example: 2, desc: '注册表里必须唯一的数字标识' },
  { name: 'name', type: 'string', required: true, example: 'linux-demo', desc: '显示用的名字' },
  { name: 'kernel_path', type: 'file', required: true, example: '/guest/linux/linux-qemu', desc: '内核镜像在客户机文件系统里的路径，必须已就位' },
  { name: 'rootfs_path', type: 'file', required: false, accept: ['.img'], example: '/guest/linux/rootfs-x86_64-alpine.img', desc: '根盘镜像，留空即无盘客户机' },
  { name: 'entry_point', type: 'address', required: true, default: '0x8020_0000', desc: '内核入口的客户机物理地址' },
  { name: 'kernel_load_addr', type: 'address', required: true, default: '0x8020_0000', desc: '内核装载到的客户机物理地址' },
  { name: 'memory_base', type: 'address', required: true, default: '0x8000_0000', desc: '客户机内存的起始地址' },
  { name: 'memory_mb', type: 'integer', required: true, example: 256, desc: '客户机内存大小（MiB）' },
  { name: 'cpu_num', type: 'integer', required: false, default: 1, desc: '给客户机几个 vCPU' },
  { name: 'guest_type', type: 'enum', required: false, default: 'virtualized', options: ['virtualized', 'passthrough'], desc: 'virtualized：设备全模拟；passthrough：直通物理设备' },
  { name: 'cmdline', type: 'string', required: false, default: 'root=/dev/vda ro rootwait console=ttyS0 init=/bin/sh', desc: '传给内核的命令行' },
];

const inPlace = (path) => GUEST_FILES.includes(path.trim());
/* 预填的 id 要同时避开注册表和配置池：池里的 id 一旦被表单占用，
 * create 会与池条目撞车（后端对这个同样是 409）。 */
const nextFreeId = () =>
  Math.max(0, ...VMS.map((v) => Number(v.id.replace('vm-', '')) || 0), ...POOL.map((p) => p.id)) + 1;
const blankValues = () =>
  Object.fromEntries(
    SCHEMA.map((f) => [f.name, f.default === undefined ? '' : String(f.default)])
  );

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const icon = (id, size = 15) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}"><use href="#${id}" /></svg>`;
const memStr = (g) => (g >= 1 ? `${g.toFixed(1)} GiB` : `${Math.round(g * 1024)} MiB`);
const bytes = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.round(n / 1024)} KB`);
const num = (n) => n.toLocaleString('en-US');

const holds = (vm) => vm.status === 'Running' || vm.status === 'Paused';
const occupancy = () =>
  Array.from({ length: PCPUS }, (_, cpu) => VMS.filter((v) => holds(v) && v.cpus.includes(cpu)));
const usedCpus = () => occupancy().filter((o) => o.length > 0).length;
const totalVcpus = () => VMS.reduce((n, v) => n + v.vcpus, 0);
const totalMem = () => VMS.reduce((n, v) => n + v.mem, 0);
const runningCount = () => VMS.filter((v) => v.status === 'Running').length;

const state = {
  view: 'vms',
  theme: localStorage.getItem('axvisor.theme') || 'stage',
  hover: null,
  cmdkOpen: false,
  cmdkIndex: 0,
  query: '',
};

/* ---------- 顶栏 ---------- */
function renderChips() {
  $('#chipArch').textContent = HOST.arch;
  $('#chipCpus').textContent = `${PCPUS} 物理核`;
  $('#chipLoad').textContent = `${usedCpus()} 核已划分`;
  $('#sbAddr').textContent = HOST.listen;
}

/* ---------- 侧栏 ---------- */
function renderNav() {
  const group = (title, items) =>
    `<div class="rail-group"><div class="label">${title}</div>${items}</div>`;
  const item = (v) =>
    `<button class="nav-item" data-view="${v.id}" aria-current="${state.view === v.id}">
      ${icon(v.icon)}<span>${v.label}</span>
      ${v.count ? `<span class="nav-count">${v.count()}</span>` : ''}
    </button>`;
  $('#nav').innerHTML =
    group('能力', VIEWS.map(item).join('')) + group('系统', SYS_VIEWS.map(item).join(''));
  $$('#nav .nav-item').forEach((b) => b.addEventListener('click', () => switchView(b.dataset.view)));
}

/* ---------- 客户机卡片 ---------- */
function vmCard(v) {
  const live = v.status === 'Running';
  return `<article class="vm-card${live ? ' live' : ''}" data-vm="${v.id}" tabindex="0">
    <div class="card-top">
      <span class="state ${v.status.toLowerCase()}"><span class="dot"></span>${STATE_CN[v.status]}</span>
      <span class="card-os">${esc(v.os)}</span>
    </div>
    <div class="card-name">${esc(v.name)}</div>
    <div class="card-spec">
      <span><b>${v.vcpus}</b> vCPU</span>
      <span class="q">·</span>
      <span><b>${memStr(v.mem)}</b></span>
    </div>
    <div class="card-pin">物理核 ${v.cpus.join(', ')}</div>
    <div class="card-ops">
      <button class="mini" data-act="console">控制台</button>
      <button class="mini" data-act="${live ? 'stop' : 'start'}">${live ? '停止' : '启动'}</button>
    </div>
  </article>`;
}

/* ---------- 主视图 ---------- */
function viewVms() {
  const used = usedCpus();
  const free = PCPUS - used;

  const capacity = `<div class="capacity">
    <div class="cap-head">
      <span class="t">整机余量</span>
      <span class="m">${HOST.cpus} 个物理核</span>
      <span class="cap-right">
        <span class="n">${used}<span class="of">/${PCPUS}</span></span>
        <span class="lb">已划分</span>
        <span class="n">${free}</span>
        <span class="lb">空闲</span>
      </span>
    </div>
    <div class="cap-bar">
      ${Array.from({ length: PCPUS }, (_, i) => {
        const owners = occupancy()[i];
        const cls = owners.length > 1 ? ' shared' : owners.length === 1 ? ' used' : '';
        return `<i class="${cls.trim()}" title="pCPU ${i}${
          owners.length ? '：' + owners.map((v) => v.name).join(' + ') : '：空闲'
        }"></i>`;
      }).join('')}
    </div>
    <div class="cap-note">
      已分配 <span class="mono">${memStr(totalMem())}</span> 内存
      <span class="q">· 宿主总量不由控制面导出，界面不做估算</span>
    </div>
  </div>`;

  return `
  <section class="hero rise" style="--i:0">
    <p class="hero-stmt">
      这台物理机划分为 <span class="num" data-count="${VMS.length}">0</span> 个隔离的客户机<span class="dim">，</span>
      其中 <span class="num" data-count="${runningCount()}">0</span> 个正在运行<span class="dim">。</span>
    </p>
    <div class="hero-sub">
      <span>AxVisor <span class="k">${HOST.version}</span></span>
      <span class="sep">·</span>
      <span>${esc(HOST.platform)}</span>
      <span class="sep">·</span>
      <span>${PCPUS} 个物理核，已划分 <span class="k">${used}</span></span>
      <span class="sep">·</span>
      <span>vCPU 合计 <span class="k">${totalVcpus()}</span>（超配比 ${(totalVcpus() / PCPUS).toFixed(1)}×）</span>
    </div>
    ${capacity}
    <div class="pane-notice" id="paneNotice" hidden></div>
  </section>

  <section class="section rise" style="--i:1">
    <div class="section-head">
      <span class="title">客户机</span>
      <span class="count">${VMS.length}</span>
    </div>
    <div class="card-grid">
      ${VMS.map(vmCard).join('')}
      <article class="vm-card new" tabindex="0">
        <div class="new-plus">+</div>
        <div class="new-label">从配置池加载客户机</div>
      </article>
    </div>
  </section>`;
}

/* 操作被拒时的一句话说明，说在动作发生的地方 */
let noticeTimer = null;
function notice(text) {
  const el = $('#paneNotice');
  if (!el) return;
  el.hidden = false;
  el.innerHTML = `<span>${esc(text)}</span><button class="icon-btn" aria-label="关闭">${icon('i-close', 13)}</button>`;
  $('button', el).addEventListener('click', () => (el.hidden = true));
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => (el.hidden = true), 6000);
}

/* ---------- 宿主机：按核密度带（核数自适应） ---------- */
function coreDensity() {
  const occ = occupancy();
  return `<div class="density" style="--n:${PCPUS}">
    ${occ
      .map((owners, i) => {
        const cls = owners.length > 1 ? 'shared' : owners.length === 1 ? 'used' : '';
        return `<i class="${cls}" title="pCPU ${i}${
          owners.length ? '：' + owners.map((v) => v.name).join(' + ') : '：空闲'
        }"></i>`;
      })
      .join('')}
  </div>`;
}

function viewHost() {
  const up = Math.floor((Date.now() - BOOT) / 1000);
  const h = Math.floor(up / 3600);
  const m = Math.floor((up % 3600) / 60);
  const kv = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const occ = occupancy();
  const shared = occ.filter((o) => o.length > 1).length;
  return `<div class="pane">
    <h2>宿主机</h2>
    <div class="sub">运行 AxVisor 的物理机器。</div>
    ${kv('版本', HOST.version)}

const RENDER = { vms: viewVms, console: viewConsole, files: viewFiles, shell: viewShell, host: viewHost };

function switchView(id) {
  if (!RENDER[id]) return;
  state.view = id;
  state.hover = null;
  $$('#nav .nav-item').forEach((b) => b.setAttribute('aria-current', String(b.dataset.view === id)));
  $('#workspace').innerHTML = RENDER[id]();
  bindWorkspace();
}

function bindWorkspace() {
  renderChips();
  countUp();
  $$('.vm-card[data-vm]').forEach((card) => {
    const id = card.dataset.vm;
    card.addEventListener('click', (e) => {
      if (e.target.closest('[data-act]')) return;
      openDrawer(id);
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') openDrawer(id);
    });
  });
  $$('.vm-card.new').forEach((card) => {
    card.addEventListener('click', () => openCreateSheet());
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') openCreateSheet();
    });
  });
  $$('[data-act="console"]').forEach((b) =>
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      switchView('console');
    })
  );
  /* start / stop 走控制面的真实语义：stop 后重启是被拒的（409），
   * 这不是界面偷懒，是后端当前的限制。 */
  $$('[data-act="start"], [data-act="stop"]').forEach((b) =>
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      const v = VMS.find((x) => x.id === b.closest('.vm-card').dataset.vm);
      if (!v) return;
      if (b.dataset.act === 'start' && v.status === 'Stopped') {
        pushEvent(`vm-${v.id.replace('vm-', '')} 启动被拒：409 —— 停止后的客户机不支持重启`);
        notice(`「${v.name}」已停止，控制面不支持停止后重启（409）。删除后可从配置池重建。`);
        return;
      }
      if (b.dataset.act === 'start') {
        v.status = 'Running';
        v.cpus = pickCpus(v.vcpus);
        pushEvent(`vm-${v.id.replace('vm-', '')} 已启动：${v.name} → 物理核 ${v.cpus.join(', ')}`);
      } else {
        v.status = 'Stopped';
        v.cpus = [];
        v.rate = 0;
        pushEvent(`vm-${v.id.replace('vm-', '')} 停止请求已接受（异步完成）：${v.name}`);
      }
      switchView('vms');
    })
  );
  if (state.view === 'console') startConsole();
}

/* 数字滚动：一次性的入场质感 */
function countUp() {
  $$('[data-count]').forEach((el) => {
    const to = Number(el.dataset.count);
    const dur = 620;
    const t0 = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * eased);
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* 内部计数仍在前推，但只在抽屉里被看到 */
function pulseTick() {
  VMS.forEach((v) => {
    if (v.status !== 'Running') {
      v.rate = 0;
      return;
    }
    const step = 18 + Math.round(Math.random() * 46);
    v.entry += step;
    v.rate = Math.round(step * (1000 / TICK_MS));
  });
}

/* ---------- 新建客户机 ---------- */
let createState = null;

/* 物理核：优先挑没人用的，不够就从占得最少的核上叠（超配比本来就是允许的） */
function pickCpus(n) {
  const occ = occupancy();
  const free = occ.map((o, i) => [i, o.length]).filter(([, c]) => c === 0).map(([i]) => i);
  if (free.length >= n) return free.slice(0, n);
  const byLoad = occ
    .map((o, i) => [i, o.length])
    .sort((a, b) => a[1] - b[1])
    .map(([i]) => i);
  return [...free, ...byLoad.filter((i) => !free.includes(i))].slice(0, n);
}

const guessOs = (kernelPath) =>
  /arceos/i.test(kernelPath) ? 'ArceOS'
  : /nimbos/i.test(kernelPath) ? 'NimbOS'
  : /linux/i.test(kernelPath) ? 'Linux'
  : 'Guest';

function openCreateSheet(prefill) {
  if ($('.drawer.create')) return;
  createState = {
    values: Object.assign(blankValues(), { id: String(nextFreeId()) }, prefill || {}),
    error: '',
    /* 本机选中的文件，按字段存；传给客户机文件系统之前它不能作为字段值提交 */
    local: {},
    target: {},
    xfer: {},
  };
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="scrim" data-close></div>
    <aside class="drawer wide create" role="dialog" aria-label="新建客户机">
      <div class="drawer-head">
        <div style="flex:1">
          <div class="t">新建客户机</div>
          <div class="s">字段集来自 <span class="mono">GET /api/vms/schema</span>，提交为 <span class="mono">POST /api/vms/create</span></div>
        </div>
        <button class="icon-btn" data-close aria-label="关闭">${icon('i-close', 15)}</button>
      </div>
      <div class="drawer-body" id="createBody"></div>
      <div class="sheet-foot" id="createFoot"></div>
    </aside>`;
  document.body.appendChild(wrap);
  /* 强制一次 reflow 让初始样式先落定，再入 .in 播过渡——
   * 不依赖 rAF，无头浏览器与降速环境下同样可靠。 */
  const scrim = $('.scrim', wrap);
  const drawer = $('.drawer', wrap);
  void drawer.offsetWidth;
  scrim.classList.add('in');
  drawer.classList.add('in');
  $$('[data-close]', wrap).forEach((el) => el.addEventListener('click', () => closeDrawer(wrap)));

  $('#createBody', wrap).addEventListener('input', (e) => {
    const name = e.target.dataset.f;
    if (!name) return;
    createState.values[name] = e.target.value;
    createState.error = '';
    renderCreateFoot();
    renderCreateWarnings();
  });
  $('#createBody', wrap).addEventListener('change', (e) => {
    const fileField = e.target.dataset.file;
    if (fileField && e.target.files && e.target.files[0]) {
      return onLocalPicked(fileField, e.target.files[0]);
    }
    const name = e.target.dataset.f;
    if (!name) return;
    createState.values[name] = e.target.value;
    renderCreateFoot();
    renderCreateWarnings();
  });
  $('#createBody', wrap).addEventListener('click', (e) => {
    const pick = e.target.closest('[data-pick]');
    if (pick) return openPicker(pick.dataset.pick);
    const local = e.target.closest('[data-local]');
    if (local) return pickLocal(local.dataset.local);
    const xfer = e.target.closest('[data-xfer]');
    if (xfer) return startTransfer(xfer.dataset.xfer);
    const poolStart = e.target.closest('[data-pool]');
    if (poolStart) return startFromPool(Number(poolStart.dataset.pool), wrap);
    const poolFill = e.target.closest('[data-fill]');
    if (poolFill) {
      const entry = POOL.find((p) => p.id === Number(poolFill.dataset.fill));
      createState.values = Object.assign(createState.values, {
        id: String(entry.id),
        name: entry.name,
        cpu_num: String(entry.cpu_num),
        memory_mb: String(entry.memory_mb),
        entry_point: entry.entry,
        kernel_load_addr: entry.entry,
      });
      createState.error = '';
      renderCreate();
    }
  });

  renderCreate();
}

function renderCreate() {
  const body = $('#createBody');
  if (!body) return;
  const values = createState.values;

  const poolRows = POOL.map(
    (p) => `<div class="pool-row">
      <div class="pool-main">
        <div class="pool-name">${esc(p.name)}<span class="pool-id mono">ID ${p.id}</span></div>
        <div class="pool-meta">${esc(p.path)} · 来源 ${esc(p.source)} · ${p.cpu_num} vCPU · ${p.memory_mb} MiB</div>
      </div>
      <button class="mini" data-fill="${p.id}">填表</button>
      <button class="mini go" data-pool="${p.id}">启动</button>
    </div>`
  ).join('');

  const form = SCHEMA.map((f) => {
    const v = values[f.name] ?? '';
    const tag = f.required ? '<span class="req">必填</span>' : '<span class="opt">可选</span>';
    const ph = f.example === undefined ? '' : ` placeholder="${esc(String(f.example))}"`;
    let control;
    if (f.type === 'enum') {
      control = `<select class="f-in" data-f="${f.name}">${f.options
        .map((o) => `<option${o === v ? ' selected' : ''}>${o}</option>`)
        .join('')}</select>`;
    } else if (f.type === 'file') {
      control = `<div class="f-file">
        <input class="f-in" data-f="${f.name}" value="${esc(v)}"${ph} />
        <button class="mini" data-pick="${f.name}">已就位…</button>
        <button class="mini" data-local="${f.name}">本机…</button>
      </div>
      <input type="file" data-file="${f.name}" hidden />`;
    } else {
      control = `<input class="f-in" data-f="${f.name}" value="${esc(v)}"${ph} />`;
    }
    return `<div class="ff" data-row="${f.name}">
      <div class="ff-k">${f.name}<span class="ff-t mono">${f.type}</span>${tag}</div>
      <div class="ff-v">${control}<div class="ff-d">${esc(f.desc)}</div><div class="ff-w"></div></div>
    </div>`;
  }).join('');

  body.innerHTML = `
    <div class="block">
      <div class="block-head"><span class="t">从配置池启动</span><span class="m">GET /api/vms/pool · 条目只是候选，start 时才创建</span></div>
      ${poolRows}
    </div>
    <div class="block">
      <div class="block-head"><span class="t">填表创建</span><span class="m">字段随后端模板变化，界面不复制一份字段表</span></div>
      ${form}
      <div class="form-note">
        内核来源只有 <span class="mono">fs</span>：填表创建的客户机从客户机文件系统读内核，
        所以 <span class="mono">kernel_path</span> 必须是已就位的文件。
      </div>
    </div>`;

  renderCreateWarnings();
  renderCreateFoot();
}

/* 每个 file 字段的即时提示。
 * 字段只接受客户机文件系统里的路径（/ 开头）；本机文件是另一个命名空间，
 * 必须先经「文件传输」落到客户机文件系统，这正是 create 门读的谓词。 */
function renderCreateWarnings() {
  const values = createState.values;
  SCHEMA.filter((f) => f.type === 'file').forEach((f) => {
    const row = $(`[data-row="${f.name}"] .ff-w`);
    if (!row) return;
    const path = (values[f.name] ?? '').trim();
    const local = createState.local[f.name];
    const item = createState.xfer[f.name];
    let text = '';

    if (item) {
      const pct = ((item.done / item.total) * 100).toFixed(0);
      text = `<span class="ok">正在传输 ${esc(item.name)} → ${esc(item.path)} · ${pct}%</span>`;
    } else if (local) {
      const target = createState.target[f.name];
      text = `<span class="warn">本机文件 ${esc(local.name)}（${bytes(local.size)}），不在客户机文件系统中</span>
        <button class="mini go" data-xfer="${f.name}">传到 ${esc(target)} 并填入</button>`;
    } else if (path && !path.startsWith('/')) {
      text = `<span class="warn">这是本机路径；字段只接受客户机文件系统里的路径</span>
        <button class="mini go" data-local="${f.name}">从本机选文件</button>`;
    } else if (path && !inPlace(path)) {
      text = `<span class="warn">不在客户机文件系统中 —— 提交会被 409 拒，并提示先传输</span>
        <button class="mini go" data-local="${f.name}">从本机传入</button>`;
    } else if (path && f.accept && !f.accept.some((ext) => path.toLowerCase().endsWith(ext))) {
      text = `<span class="warn">该字段只接受 ${f.accept.join(' / ')}</span>`;
    } else if (path) {
      text = `<span class="ok">已就位 · ${esc(path)}</span>`;
    }
    row.innerHTML = text;
  });
}

/* 本机文件只能先传到客户机文件系统：路径落在 /guest 下，传完自动填入字段 */
function pickLocal(field) {
  const input = $(`[data-file="${field}"]`);
  if (input) input.click();
}

function onLocalPicked(field, file) {
  createState.local[field] = { name: file.name, size: file.size || 1024 * 1024 };
  createState.target[field] = `/guest/${file.name}`;
  createState.error = '';
  renderCreateWarnings();
  renderCreateFoot();
}

function startTransfer(field) {
  const local = createState.local[field];
  if (!local) return;
  const item = {
    name: local.name,
    total: local.size,
    done: 0,
    state: '传输中',
    path: createState.target[field],
  };
  createState.xfer[field] = item;
  TRANSFERS.push(item);
  pushEvent(`开始传输 ${local.name} → ${item.path}`);
  renderCreateWarnings();
}

/* 传输推进：POST /api/files 的分片在这里只是进度，落盘后路径才进客户机文件系统 */
function transferTick() {
  let moved = false;
  TRANSFERS.forEach((t) => {
    if (t.state !== '传输中') return;
    t.done = Math.min(t.total, t.done + Math.max(t.total * 0.18, 1));
    moved = true;
    if (t.done >= t.total) {
      t.state = '完成';
      if (!GUEST_FILES.includes(t.path)) GUEST_FILES.push(t.path);
      pushEvent(`传输完成：${t.path}`);
    }
  });
  if (!createState) {
    if (moved && state.view === 'files') switchView('files');
    return;
  }
  Object.keys(createState.xfer).forEach((field) => {
    const item = createState.xfer[field];
    if (item.state !== '完成') return;
    createState.values[field] = item.path;
    delete createState.local[field];
    delete createState.target[field];
    delete createState.xfer[field];
    const input = $(`[data-f="${field}"]`);
    if (input) input.value = item.path;
  });
  renderCreateWarnings();
  renderCreateFoot();
  if (moved && state.view === 'files') switchView('files');
}

function renderCreateFoot() {
  const foot = $('#createFoot');
  if (!foot) return;
  const values = createState.values;
  const missing = SCHEMA.filter((f) => f.type === 'file')
    .map((f) => (values[f.name] ?? '').trim())
    .filter((p) => p && !inPlace(p));

  foot.innerHTML = `
    ${createState.error ? `<div class="foot-err">${esc(createState.error)}</div>` : ''}
    ${missing.length && !createState.error
      ? `<div class="foot-warn">未就位：${missing.map(esc).join('、')}</div>`
      : ''}
    <div class="foot-ops">
      <button class="btn" id="createOnly">仅创建</button>
      <button class="btn btn-primary" id="createStart">创建并启动</button>
    </div>`;

  $('#createOnly', foot)?.addEventListener('click', () => submitCreate(false));
  $('#createStart', foot)?.addEventListener('click', () => submitCreate(true));
}

/* 选已就位文件：列表来自 GET /api/vms/browse */
function openPicker(fieldName) {
  const wrap = document.createElement('div');
  wrap.className = 'picker-wrap';
  wrap.innerHTML = `<div class="picker" role="dialog" aria-label="选择已就位文件">
      <div class="picker-head">/guest<span class="m">GET /api/vms/browse</span></div>
      ${GUEST_FILES.map(
        (p) => `<button class="pick-row" data-path="${esc(p)}">
          <span class="mono">${esc(p)}</span>
          <span class="st">在客户机文件系统中</span>
        </button>`
      ).join('')}
    </div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.addEventListener('click', (e) => {
    const row = e.target.closest('[data-path]');
    if (row) {
      createState.values[fieldName] = row.dataset.path;
      createState.error = '';
      const input = $(`[data-f="${fieldName}"]`);
      if (input) input.value = row.dataset.path;
      renderCreateWarnings();
      renderCreateFoot();
      close();
      return;
    }
    if (e.target === wrap) close();
  });
}

function submitCreate(andStart) {
  const values = createState.values;
  for (const f of SCHEMA) {
    const text = (values[f.name] ?? '').trim();
    if (text.length === 0) {
      if (f.required) return fail(`「${f.name}」是必填项`);
      continue;
    }
    if (f.type === 'integer' && !/^\d+$/.test(text)) {
      return fail(`「${f.name}」要一个非负整数，收到「${text}」`);
    }
    if (f.type === 'address' && !/^(0[xX][0-9a-fA-F_]+|\d+)$/.test(text.replace(/_/g, ''))) {
      return fail(`「${f.name}」要一个地址（十进制或 0x 开头），收到「${text}」`);
    }
    if (f.type === 'enum' && f.options && !f.options.includes(text)) {
      return fail(`「${f.name}」只能是 ${f.options.join(' / ')}`);
    }
  }

  const id = Number(values.id);
  if (VMS.some((v) => Number(v.id.replace('vm-', '')) === id) || POOL.some((p) => p.id === id)) {
    return fail(`ID ${id} 已被注册表或配置池占用 —— 后端返回 409 Conflict`);
  }
  /* 本机路径不是客户机文件系统里的路径：直接提交等于让 create 去读一个它
   * 根本没有的文件，这里先说清楚，而不是等 409。 */
  const localPath = SCHEMA.filter((f) => f.type === 'file')
    .map((f) => (values[f.name] ?? '').trim())
    .find((p) => p && !p.startsWith('/'));
  if (localPath) {
    return fail(`「${localPath}」是本机路径，字段只接受客户机文件系统里的路径；先用「本机…」把它传进去`);
  }
  const unplaced = SCHEMA.filter((f) => f.type === 'file')
    .map((f) => (values[f.name] ?? '').trim())
    .filter((p) => p && !inPlace(p));
  if (unplaced.length) {
    return fail(`「${unplaced[0]}」不在客户机文件系统中，先传输 —— 后端返回 409 并提示先传输`);
  }

  const vcpus = Number(values.cpu_num || 1);
  const vm = {
    id: `vm-${id}`,
    name: values.name,
    os: guessOs(values.kernel_path),
    status: andStart ? 'Running' : 'Stopped',
    vcpus,
    mem: Number(values.memory_mb) / 1024,
    cpus: andStart ? pickCpus(vcpus) : [],
    entry: 0,
    park: 0,
    rate: 0,
    image: values.kernel_path.split('/').pop(),
    cmdline: values.cmdline,
    config: `${values.name}.toml`,
  };
  VMS.push(vm);
  pushEvent(`vm-${id} 创建${andStart ? '并启动' : ''}成功：${vm.name}（${vcpus} vCPU · ${values.memory_mb} MiB）`);
  closeDrawer($('.drawer.create')?.parentElement);
  createState = null;
  switchView('vms');

  function fail(message) {
    createState.error = message;
    renderCreateFoot();
    const err = $('.foot-err');
    if (err) {
      err.animate(
        [
          { transform: 'translateX(0)' },
          { transform: 'translateX(-4px)' },
          { transform: 'translateX(4px)' },
          { transform: 'translateX(0)' },
        ],
        { duration: 180, easing: 'ease-out' }
      );
    }
  }
}

/* POST /api/vms/{id}/start：未注册的 id 由控制面先从池条目创建，所以池里的一项
 * 可以直接启动，不需要先 create。 */
function startFromPool(poolId, wrap) {
  const entry = POOL.find((p) => p.id === poolId);
  if (!entry) return;
  const existing = VMS.find((v) => Number(v.id.replace('vm-', '')) === entry.id);
  if (existing) {
    if (existing.status === 'Stopped') {
      pushEvent(`vm-${entry.id} 启动被拒：409 —— 停止后的客户机不支持重启`);
    } else {
      existing.status = 'Running';
      existing.cpus = pickCpus(existing.vcpus);
      pushEvent(`vm-${entry.id} 已启动：${existing.name}`);
    }
  } else {
    VMS.push({
      id: `vm-${entry.id}`,
      name: entry.name,
      os: guessOs(entry.name),
      status: 'Running',
      vcpus: entry.cpu_num,
      mem: entry.memory_mb / 1024,
      cpus: pickCpus(entry.cpu_num),
      entry: 0,
      park: 0,
      rate: 0,
      image: `${entry.name}.img`,
      cmdline: '',
      config: entry.path.split('/').pop(),
    });
    pushEvent(`vm-${entry.id} 由配置池创建并启动：${entry.name}（${entry.path}）`);
  }
  closeDrawer(wrap);
  createState = null;
  switchView('vms');
}

/* ---------- 命令面板 ---------- */
function openCmdk() {
  if (state.cmdkOpen) return;
  state.cmdkOpen = true;
  state.query = '';
  state.cmdkIndex = 0;
  const wrap = document.createElement('div');
  wrap.className = 'cmdk-wrap';
  wrap.innerHTML = `<div class="cmdk" role="dialog" aria-label="命令面板">
    <input id="cmdkInput" placeholder="跳转到面板或客户机…" />
    <div class="cmdk-list" id="cmdkList"></div>
  </div>`;
  document.body.appendChild(wrap);
  const close = () => {
    wrap.remove();
    state.cmdkOpen = false;
  };
  wrap.addEventListener('click', (e) => {
    if (e.target === wrap) close();
  });
  $('#cmdkInput', wrap).addEventListener('input', (e) => {
    state.query = e.target.value;
    state.cmdkIndex = 0;
    renderCmdk();
  });
  $('#cmdkInput', wrap).addEventListener('keydown', (e) => {
    const items = cmdkItems();
    if (e.key === 'Escape') return close();
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      state.cmdkIndex = (state.cmdkIndex + 1) % items.length;
      renderCmdk();
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      state.cmdkIndex = (state.cmdkIndex - 1 + items.length) % items.length;
      renderCmdk();
    }
    if (e.key === 'Enter') {
      const it = items[state.cmdkIndex];
      if (it) {
        close();
        it.run();
      }
    }
  });
  $('#cmdkInput', wrap).focus();
  renderCmdk();
}

function cmdkItems() {
  const q = state.query.trim().toLowerCase();
  const views = [...VIEWS, ...SYS_VIEWS].map((v) => ({
    icon: v.icon,
    label: v.label,
    hint: '面板',
    run: () => switchView(v.id),
  }));
  const vms = VMS.map((v) => ({
    icon: 'i-server',
    label: v.name,
    hint: STATE_CN[v.status],
    run: () => {
      switchView('vms');
      setTimeout(() => openDrawer(v.id), 60);
    },
  }));
  const actions = [
    {
      icon: 'i-plus',
      label: '新建客户机',
      hint: '字段来自 schema',
      run: () => {
        switchView('vms');
        setTimeout(() => openCreateSheet(), 60);
      },
    },
    ...POOL.map((p) => ({
      icon: 'i-play',
      label: `启动 ${p.name}`,
      hint: '配置池',
      run: () => {
        switchView('vms');
        setTimeout(() => startFromPool(p.id, null), 60);
      },
    })),
  ];
  return [...actions, ...views, ...vms].filter((i) => !q || i.label.toLowerCase().includes(q));
}

function renderCmdk() {
  const list = $('#cmdkList');
  if (!list) return;
  const items = cmdkItems();
  if (!items.length) {
    list.innerHTML = `<div class="cmdk-empty">没有匹配项</div>`;
    return;
  }
  list.innerHTML = items
    .map(
      (it, i) => `<button class="cmdk-item${i === state.cmdkIndex ? ' on' : ''}" data-i="${i}">
        ${icon(it.icon, 14)}<span>${esc(it.label)}</span>
        <span class="hint">${esc(it.hint)}</span>
      </button>`
    )
    .join('');
  $$('.cmdk-item', list).forEach((b) =>
    b.addEventListener('click', () => {
      const it = cmdkItems()[Number(b.dataset.i)];
      document.querySelector('.cmdk-wrap')?.remove();
      state.cmdkOpen = false;
      it.run();
    })
  );
}

/* ---------- 控制台日志 ---------- */
function startConsole() {
  const body = $('#termBody');
  if (!body) return;
  let i = 0;
  const push = () => {
    if (!document.body.contains(body)) return;
    if (i < BOOTLOG.length) {
      const div = document.createElement('div');
      div.innerHTML = `<span class="ts">${String(i).padStart(3, '0')}</span> ${esc(BOOTLOG[i])}`;
      body.appendChild(div);
      i++;
      setTimeout(push, 90 + Math.random() * 130);
    }
  };
  push();
}

/* ---------- 底部事件流 ---------- */
const EVENT_QUEUE = [];
const pushEvent = (text) => EVENT_QUEUE.push(text);

function streamEvents() {
  const el = $('#evStream');
  if (!el) return;
  let i = 0;
  let j = 0;
  let line = EVENTS[0];
  const step = () => {
    if (j === 0) {
      line = EVENT_QUEUE.length ? EVENT_QUEUE.shift() : EVENTS[i];
    }
    if (j <= line.length) {
      el.innerHTML = `${esc(line.slice(0, j))}<span class="caret"></span>`;
      j++;
      setTimeout(step, 26);
    } else {
      j = 0;
      i = (i + 1) % EVENTS.length;
      setTimeout(step, 900);
    }
  };
  step();
}

function tickTime() {
  const up = Math.floor((Date.now() - BOOT) / 1000);
  const h = Math.floor(up / 3600);
  const m = Math.floor((up % 3600) / 60);
  const s = up % 60;
  $('#sbUp').textContent = `up ${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
}

function setTheme(name) {
  state.theme = name;
  document.documentElement.dataset.theme = name;
  localStorage.setItem('axvisor.theme', name);
  $$('#themeSwitch button').forEach((b) => b.classList.toggle('on', b.dataset.theme === name));
}

function boot() {
  $('#themeSwitch').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) setTheme(b.dataset.theme);
  });
  $('#cmdkBtn').addEventListener('click', openCmdk);
  $('#createBtn').addEventListener('click', () => openCreateSheet());
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      openCmdk();
    }
  });

  renderNav();
  setTheme(state.theme);
  switchView('vms');
  streamEvents();
  tickTime();
  setInterval(tickTime, 1000);
  setInterval(pulseTick, TICK_MS);
  setInterval(transferTick, 600);
}

boot();

</script>
