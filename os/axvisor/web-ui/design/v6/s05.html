<!DOCTYPE html>
<html lang="zh-CN" data-theme="stage">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AxVisor 控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="i-server" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M9 3v18M15 3v18" />
        </g>
        <g id="i-terminal" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 17l6-5-6-5" />
          <path d="M12 19h8" />
        </g>
        <g id="i-file" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
          <path d="M14 3v5h5" />
        </g>
        <g id="i-shell" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="4" width="19" height="16" rx="2" />
          <path d="M7 9l3 3-3 3M13 15h4" />
        </g>
        <g id="i-cpu" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="6" width="12" height="12" rx="1.5" />
          <path d="M10 2v4M14 2v4M10 18v4M14 18v4M2 10h4M2 14h4M18 10h4M18 14h4" />
        </g>
        <g id="i-play" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 4.5l12 7.5-12 7.5z" />
        </g>
        <g id="i-stop" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6.5" y="6.5" width="11" height="11" rx="1.5" />
        </g>
        <g id="i-trash" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" />
        </g>
        <g id="i-search" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-4.2-4.2" />
        </g>
        <g id="i-close" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 6l12 12M18 6L6 18" />
        </g>
        <g id="i-mark" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7l9-4 9 4-9 4z" />
          <path d="M3 12l9 4 9-4" />
          <path d="M3 17l9 4 9-4" />
        </g>
      </defs>
    </svg>

    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24"><use href="#i-mark" /></svg>
        <span class="brand-name">AXVISOR</span>
        <span class="brand-ver">0.8.2</span>
      </div>

      <div class="topbar-mid">
        <span id="chipArch">x86_64</span>
        <span class="sep">·</span>
        <span id="chipCpus">8 物理核</span>
        <span class="sep">·</span>
        <span id="chipLoad">6 核已划分</span>
      </div>

      <div class="topbar-actions">
        <button class="btn" id="cmdkBtn">
          <svg viewBox="0 0 24 24" width="14" height="14"><use href="#i-search" /></svg>
          <span>搜索</span>
          <span class="mono" style="color: var(--ink-4); font-size: 11px">⌘K</span>
        </button>
        <div class="theme-switch" id="themeSwitch">
          <button data-theme="stage">舞台</button>
          <button data-theme="daylight">日光</button>
          <button data-theme="phosphor">磷光</button>
        </div>
      </div>
    </header>

    <div class="shell">
      <nav class="rail" id="nav"></nav>
      <main class="workspace" id="workspace"></main>
    </div>

    <footer class="statusbar">
      <span class="live"><span class="dot"></span>运行中</span>
      <span class="ev" id="evStream"></span>
      <span class="right">
        <span id="sbUp">—</span>
        <span id="sbAddr">0.0.0.0:8080</span>
      </span>
    </footer>

    <script src="app.js"></script>
  <script>window.onerror=function(m){document.title='ERR:'+m};setTheme('stage');switchView('host');</script></body>
</html>
