# PR C: axum start/stop control API runtime verification.
# `no-auto-start` keeps the default VMs in `Ready` so the self-test can drive
# one VM through the full lifecycle via the HTTP control API. The guest image is
# embedded at build time (`image_location = "memory"` -> build.rs
# include_bytes!), so no `fs` feature is required; the vmconfig (untracked under
# `os/axvisor/tmp/vmconfigs/`) is generated locally.
features = [
    "http-test",
    "no-auto-start",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = ["os/axvisor/tmp/vmconfigs/arceos-aarch64-http-control.toml"]
