# PR E: runtime create/delete over the axum control API.
# No default VMs are registered (`vm_configs = []`): the host probe creates a VM
# entirely from scratch via `POST /api/vms/create`, driving the *default* Linux
# guest config (`linux-smp1.toml`) through create -> ready -> duplicate-create
# 409 -> delete -> gone. The config is sent verbatim as the create body and its
# kernel is loaded from the rootfs filesystem at runtime
# (`image_location = "fs"`, `/guest/linux/linux-qemu`), so the `fs` feature +
# NVMe driver are required. CI runs `cargo xtask image pull` before the test to
# provision the rootfs.
features = [
    "http-axum",
    "fs",
    "ax-driver/nvme",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = []

# Control-plane auth + bind. The mutating routes require
# `Authorization: Bearer <token>`; the host probe sends this same token
# (`[host_http_probe] token`), and hostfwd reachability requires binding all
# interfaces.
[env]
AXVM_HTTP_TOKEN = "axvisor-http-test-token"
AXVM_HTTP_BIND = "0.0.0.0:8080"
