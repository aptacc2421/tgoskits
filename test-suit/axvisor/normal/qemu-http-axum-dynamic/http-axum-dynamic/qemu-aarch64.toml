args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "2",
  # `-m 1g`: the dynamic test's guest uses a 256M MAP_IDENTICAL region, and the
  # hypervisor plus that region must both fit in QEMU's total RAM (same sizing as
  # the control test, whose guest config the dynamic guest mirrors).
  "-m",
  "1g",
]
timeout = 600
# The runner's stream matcher stops at the FIRST match (fail checked before
# success), so per-step status lines cannot be asserted independently. The
# self-test verifies every step internally and prints exactly one sentinel:
# PASSED only if the full create/delete lifecycle
# (remove -> create -> ready -> 409 -> remove -> 404) met every expectation.
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "HTTP self-test: dynamic create/delete FAILED",
]
success_regex = [
  "HTTP self-test: dynamic create/delete PASSED",
]
to_bin = true
uefi = false
