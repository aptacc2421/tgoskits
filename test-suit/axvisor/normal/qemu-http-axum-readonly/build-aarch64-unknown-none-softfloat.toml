# PR B: axum read-only HTTP API runtime verification.
# http-test implies http-axum (tokio + axum + serde_json). fs/nvme is not
# enabled: QEMU has no disk and fs would panic at boot; this test only
# verifies the management HTTP server runs.
features = [
    "http-test",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = []

# This test artifact is also used by the quickstart's manual hostfwd + curl
# flow, which needs the in-guest listener to accept connections on the guest
# NIC IP, so opt in to all interfaces. The self-test runs in-process before the
# bind, so this does not affect the assertions.
[env]
AXVM_HTTP_BIND = "0.0.0.0:8080"
