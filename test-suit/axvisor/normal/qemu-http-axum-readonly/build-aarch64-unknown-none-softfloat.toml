# PR B: axum read-only HTTP API runtime verification.
# `http-axum` builds the tokio + axum + serde_json management server. fs/nvme is
# not enabled: QEMU has no disk and this test only verifies the management HTTP
# server runs. The host-side probe (QEMU hostfwd) drives the API over real TCP
# and asserts the read contract + auth boundary host-side.
features = [
    "http-axum",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = []

# Control-plane auth + bind. The probe's authenticated-write check needs a
# working bearer token, so one is baked here (`[host_http_probe] token` must
# match). The server binds all interfaces so QEMU hostfwd can reach it.
[env]
AXVM_HTTP_TOKEN = "axvisor-http-test-token"
AXVM_HTTP_BIND = "0.0.0.0:8080"
