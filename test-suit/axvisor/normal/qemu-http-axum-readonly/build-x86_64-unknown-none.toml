# PR B: axum read-only HTTP API runtime verification (x86_64).
# `http-axum` builds the tokio + axum + serde_json management server. fs/nvme is
# not enabled: this test only verifies the management HTTP server runs.
features = [
    "http-axum",
]
log = "Info"
target = "x86_64-unknown-none"
vm_configs = []

# httparse 1.10 (a hyper HTTP/1 parsing dependency) trips a rustc-LLVM codegen
# error at opt-level=3 on this bare-metal target where SSE is disabled: its
# runtime SSE42 fallback (#[target_feature(enable = "sse42")]) cannot be
# lowered. Disable SIMD via the official escape hatch (x86_64 only; the aarch64
# NEON path compiles fine and does not need this).
#
# Control-plane auth + bind: the probe's authenticated-write check needs a
# working bearer token, so one is baked here (`[host_http_probe] token` must
# match), and hostfwd reachability requires binding all interfaces.
[env]
CARGO_CFG_HTTPARSE_DISABLE_SIMD = "1"
AXVM_HTTP_TOKEN = "axvisor-http-test-token"
AXVM_HTTP_BIND = "0.0.0.0:8080"
