args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "2",
  "-m",
  "512M",
]
# PR B: read-only management HTTP API verification via a host-side probe.
# - `[host_http_probe]` makes the driver append `-netdev user,id=net0,hostfwd=
#   tcp::<HOST>-:<GUEST>` + `-device virtio-net-pci,netdev=net0` and run a host
#   probe that dials the in-guest API over real TCP.
# - The probe (scenario `ReadOnly`) asserts: GET /api/vms -> 200, an
#   unauthenticated write -> 401 (access-denied regression), GET /api/vms/999
#   -> 404, and an authenticated write to an unknown VM -> 404. It then quits
#   QEMU over QMP, and the runner reads its stored verdict as the test result.
# - `success_regex` is intentionally empty: the probe result, not serial output,
#   is the verdict. A guest panic still fails via `fail_regex`.
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
]
success_regex = []
timeout = 120
to_bin = true
uefi = false

[host_http_probe]
token = "axvisor-http-test-token"
