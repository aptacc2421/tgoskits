args = [
  "-no-user-config",
  "-display",
  "none",
  "-serial",
  "stdio",
  "-monitor",
  "none",
  "-cpu",
  "host,-la57,+vmx-ept,+vmx-unrestricted-guest,+vmx-flexpriority",
  "-machine",
  "q35,smbus=off,usb=off,graphics=off",
  "-smp",
  "2",
  "-accel",
  "kvm",
  "-m",
  "512M",
  "-vga",
  "none",
]
timeout = 600
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
]
success_regex = [
  "HTTP self-test: GET /api/vms -> 200",
  "HTTP self-test: GET /api/vms/999 -> 404",
]
to_bin = true
uefi = true
