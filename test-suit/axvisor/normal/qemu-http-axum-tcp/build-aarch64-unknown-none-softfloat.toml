# PR B: axum management HTTP API host->guest TCP integration verification.
# http-tcp-test implies http-axum (tokio + axum + serde_json) and adds the
# test-only POST /__probe_result relay endpoint. No tower/oneshot self-test is
# built: the TcpListener::bind + axum::serve path runs for real, and the host
# probe (QEMU hostfwd) makes actual HTTP requests to the in-guest API.
# fs/nvme is not enabled: QEMU has no disk and fs would panic at boot.
features = [
    "http-tcp-test",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = []

# Control-plane auth + bind. The mutating routes require
# `Authorization: Bearer <token>`; the host probe sends this same token
# (`[host_http_probe] token`) and also asserts an unauthenticated write is
# rejected with 401. The server binds loopback by default; QEMU hostfwd
# forwards to the guest NIC IP, so this test opts in to all interfaces.
[env]
AXVM_HTTP_TOKEN = "axvisor-http-test-token"
AXVM_HTTP_BIND = "0.0.0.0:8080"
