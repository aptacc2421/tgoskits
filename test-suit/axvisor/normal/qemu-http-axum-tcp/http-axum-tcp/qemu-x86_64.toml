args = [
  "-no-user-config",
  "-display",
  "none",
  "-serial",
  "stdio",
  "-monitor",
  "none",
  "-cpu",
  "host,-la57,+vmx-ept,+vmx-unrestricted-guest,+vmx-flexpriority",
  "-machine",
  "q35,smbus=off,usb=off,graphics=off",
  "-smp",
  "2",
  "-accel",
  "kvm",
  "-m",
  "512M",
  "-vga",
  "none",
]
# Same probe-driven contract as qemu-aarch64.toml: `[host_http_probe]` makes the
# driver append hostfwd netdev + virtio-net-pci device, and a host-side probe
# (scenario `ReadOnly`) asserts the auth boundary + read contract, then quits
# QEMU over QMP. The runner reads the stored probe verdict as the result;
# `success_regex` is empty by design. `token` must match the guest build's
# `[env] AXVM_HTTP_TOKEN`. The `+vmx-*` CPU flags require an Intel KVM host; on
# an AMD host, add a qemu-x86_64-svm.toml variant following the `smoke-svm` case.
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
]
success_regex = []
timeout = 600
to_bin = true
uefi = true

[host_http_probe]
token = "axvisor-http-test-token"
