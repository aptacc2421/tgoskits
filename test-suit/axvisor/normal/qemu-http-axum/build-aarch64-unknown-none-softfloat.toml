# Shared HTTP control-plane build for the axum management API test cases
# (http-axum-control / http-axum-readonly / http-axum-tcp).
# `no-auto-start` keeps the default Linux guest (`linux-smp1.toml`) in `Ready`:
# the control case drives it through start/stop via the HTTP control API, while
# the readonly/tcp cases only read the management server against a registered
# default VM. The guest kernel is loaded from the rootfs filesystem at runtime
# (`image_location = "fs"`, kernel at `/guest/linux/linux-qemu`), so the `fs`
# feature + NVMe driver are required. CI runs `cargo xtask image pull` before
# the test to provision the rootfs.
features = [
    "http-axum",
    "no-auto-start",
    "fs",
    "ax-driver/nvme",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = ["os/axvisor/configs/vms/qemu/aarch64/linux-smp1.toml"]

# Control-plane auth + bind. The mutating routes require
# `Authorization: Bearer <token>`; the host probe sends this same token
# (`[host_http_probe] token`), and hostfwd reachability requires binding all
# interfaces.
[env]
AXVM_HTTP_TOKEN = "axvisor-http-test-token"
AXVM_HTTP_BIND = "0.0.0.0:8080"
