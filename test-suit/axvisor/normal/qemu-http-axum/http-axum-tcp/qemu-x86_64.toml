args = [
  "-no-user-config",
  "-display",
  "none",
  "-serial",
  "stdio",
  "-monitor",
  "none",
  "-cpu",
  "host,-la57,+vmx-ept,+vmx-unrestricted-guest,+vmx-flexpriority",
  "-machine",
  "q35,smbus=off,usb=off,graphics=off",
  "-smp",
  "2",
  "-accel",
  "kvm",
  # NVMe rootfs: the shared build enables the hypervisor's `fs` feature, whose
  # boot-time init mounts the guest rootfs from this disk. The default Linux
  # guest (`linux-smp1.toml`) is registered but kept `Ready` by `no-auto-start`,
  # so only the hypervisor's own fs init touches the disk here, not a guest
  # boot. The driver rewrites the drive file to the concrete rootfs path.
  "-device",
  "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65,addr=03.0",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-x86_64-alpine.img",
  "-m",
  "512M",
  "-vga",
  "none",
]
# Host->guest TCP integration verification over QEMU user-mode networking.
# `[host_http_probe]` makes the driver append hostfwd netdev + virtio-net-pci
# device, and a host-side probe (`probe.sh`) asserts the auth boundary + read
# contract, then quits QEMU over QMP. The runner reads the stored probe verdict
# as the result; `success_regex` is empty by design. `token` must match the
# guest build's `[env] AXVM_HTTP_TOKEN`. The `+vmx-*` CPU flags require an Intel
# KVM host; on an AMD host, add a qemu-x86_64-svm.toml variant following the
# `smoke-svm` case.
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
]
success_regex = []
timeout = 600
to_bin = true
uefi = true

[host_http_probe]
token = "axvisor-http-test-token"
script = "probe.sh"
