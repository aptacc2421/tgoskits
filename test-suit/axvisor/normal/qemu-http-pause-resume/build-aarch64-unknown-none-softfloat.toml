# Pause/resume/reset control-plane build for the axum management HTTP API test
# (http-pause-resume).
# `no-auto-start` keeps the default VM (`http-pause-resume/vm-memory.toml`, a
# build-time embedded `memory` guest) in `Ready` (registered but not booted); the
# typed probe drives the pause/resume/reset lifecycle through the HTTP control
# API. The guest kernel and its BusyBox initramfs are embedded at build time, so
# no `fs`/NVMe feature is needed. CI runs `cargo xtask image pull` before the
# test to provision the QEMU images and the managed rootfs the initramfs is
# built from.
features = [
    "http-axum",
    "no-auto-start",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = ["test-suit/axvisor/normal/qemu-http-pause-resume/http-pause-resume/vm-memory.toml"]

# Control-plane auth + bind. The mutating routes require
# `Authorization: Bearer <token>`; the typed probe sends this same token
# (`[host_http_probe] token`), and hostfwd reachability requires binding all
# interfaces. The BusyBox initramfs is generated from the managed rootfs into
# the path the fixture's `ramdisk_path` points at.
[env]
AXVM_HTTP_TOKEN = "axvisor-http-test-token"
AXVM_HTTP_BIND = "0.0.0.0:8080"
AXVISOR_TEST_BUSYBOX_INITRAMFS = "tmp/axbuild/axvisor/qemu-http-pause-resume/initramfs-aarch64.cpio.gz"
