# The HTTP control plane over the VM pool: no default guest, the pool directory
# is provisioned by the `sh/` asset pipeline, and the host-side probe drives
# start/close cycles through the control API only. The point of the case is that
# a client can learn what the pool offers and start, close and restart guests by
# id without ever sending a config.
features = ["ax-driver/nvme", "fs", "http-axum"]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = []

[env]
# QEMU hostfwd reaches the guest through its non-loopback interface.
AXVM_HTTP_BIND = "0.0.0.0:8080"
# The pool directory here is the injection target of the `sh/` asset pipeline,
# which is the only pre-boot way to place complete guest configs into the guest
# filesystem. The image holds no other `.toml` file, so the directory holds
# exactly the case's fixtures.
AXVISOR_VM_POOL = "/usr/bin"
