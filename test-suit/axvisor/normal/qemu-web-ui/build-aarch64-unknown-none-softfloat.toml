# Dashboard build for the `qemu-web-ui` case.
#
# `web-ui` serves the React dashboard from assets embedded in the hypervisor at
# build time (no rootfs, no runtime filesystem read, cargo never invokes npm),
# and `browser-console` adds the terminal gateway the dashboard's guest and
# management panels drive. `no-auto-start` keeps the default VM
# (`web-ui/vm-memory.toml`, a build-time embedded `memory` guest) in `Ready`
# (registered but not booted), so the probe can assert the lane table and then
# drive start/close/create itself.
#
# The bundle is NOT built by cargo — run
# `cd os/axvisor/web-ui && npm ci && npm run build` before building this case,
# otherwise the build fails with a message naming that command. CI does it for
# the check that runs this case.
features = [
    "web-ui",
    "browser-console",
    "no-auto-start",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = ["test-suit/axvisor/normal/qemu-web-ui/web-ui/vm-memory.toml"]

# Bind contract: the probe reaches the in-guest listener through QEMU hostfwd, so
# the listener has to accept connections from the QEMU network. The BusyBox
# initramfs is generated from the managed rootfs into the path the fixture's
# `ramdisk_path` points at.
[env]
AXVM_HTTP_BIND = "0.0.0.0:8080"
AXVISOR_TEST_BUSYBOX_INITRAMFS = "tmp/axbuild/axvisor/qemu-web-ui/initramfs-aarch64.cpio.gz"
