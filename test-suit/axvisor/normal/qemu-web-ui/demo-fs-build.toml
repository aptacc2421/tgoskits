# Local demo build for looking at the dashboard with an fs-backed guest.
#
# Not a test case: the file name does not match the `build-<target>.toml` shape
# the suite discovers, so it cannot show up in a test run. Drive it with
#   cargo xtask axvisor qemu -c <this file> --qemu-config web-ui/qemu-aarch64-hostfwd.toml --arch aarch64
# and open http://localhost:8080/.
#
# `vm_configs` is deliberately absent: no guest is registered at boot, so every
# guest on the page comes from a config directory the operator can inspect and
# change. The pool reads `AXVISOR_VM_POOL` (drop-in folder, first) plus
# `AXVISOR_VM_DIRS`; both are plain folders in the guest filesystem.
features = [
    "web-ui",
    "browser-console",
    "fs",
    "ax-driver/nvme",
    "no-auto-start",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"

[env]
AXVM_HTTP_BIND = "0.0.0.0:8080"
# The drop-in folder. The root filesystem is managed and re-synced by the build,
# so a file placed here by hand does not survive a rebuild; the dashboard's
# 「存入配置池」 is how a config gets in from the UI, and any folder may hold
# configs the browser can pick from (see the 「浏览目录…」 dialog).
AXVISOR_VM_POOL = "/guest/vm_pool"
# A second folder, read after the drop-in one: this is what makes the pool
# "a few folders" rather than one.
AXVISOR_VM_DIRS = "/guest/linux"
