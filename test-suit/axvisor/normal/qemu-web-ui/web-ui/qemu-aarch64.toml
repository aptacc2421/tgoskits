args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "2",
  # The memory-backed guest boots its embedded kernel + BusyBox initramfs; the
  # initramfs is the guest rootfs (`rdinit=/init`), so no NVMe disk is needed.
  "-append",
  "console=ttyAMA0 rdinit=/init devtmpfs.mount=1 loglevel=7",
  # `-m 1g`: the guest uses a 256M MAP_ALLOC region, and the hypervisor plus
  # that region must both fit in QEMU's total RAM (same sizing as the
  # http-control-plane case).
  "-m",
  "1g",
]
# Dashboard verification via the case's host-side probe asset. `[host_http_probe]`
# makes the runner append hostfwd netdev + virtio-net-pci device and execute the
# probe asset (`http_probe.py`, next to this file) over real TCP. The asset
# asserts the dashboard served from the embedded bundle (shell, hashed assets,
# CSP/cache headers, no SPA catch-all, and the endpoints the bundle calls), the
# terminal lanes and their two sockets, and then drives the default VM
# (id 1, `vm-memory.toml`, kept `Ready` by `no-auto-start`) through start, close
# and recreate while watching the event channel; it quits QEMU over QMP and the
# runner collects the asset's exit code as the verdict.
#
# `request_timeout_secs` is above the 5s default because the management server is
# single-threaded and blocks while it builds a VM (create reads the guest image).
# `success_regex` is empty because the probe result, not serial output, is the
# verdict; a guest panic still fails via `fail_regex`.
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
]
success_regex = []
timeout = 600
to_bin = true
uefi = false

[host_http_probe]
request_timeout_secs = 30
