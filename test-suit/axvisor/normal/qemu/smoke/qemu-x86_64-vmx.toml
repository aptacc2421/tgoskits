args = [
  "-no-user-config",
  "-display",
  "none",
  "-serial",
  "stdio",
  "-monitor",
  "none",
  "-cpu",
  "host,-la57,+vmx-ept,+vmx-unrestricted-guest,+vmx-flexpriority",
  "-machine",
  "q35,smbus=off,usb=off,graphics=off",
  "-smp",
  "2",
  "-accel",
  "kvm",
  "-device",
  "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65,addr=03.0",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-x86_64-alpine.img",
  "-m",
  "512M",
  # Host-side NIC for the ArceOS network subsystem on the hypervisor itself
  # (invisible to the guest). Verified by the `use NIC 0:` success regex.
  "-netdev",
  "user,id=net0",
  "-device",
  "virtio-net-pci,netdev=net0,addr=04.0",
  "-vga",
  "none",
]
timeout = 600
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)login incorrect",
  "(?i)permission denied",
  "(?m)^(?:echo|cat|rm):",
]
success_regex = [
  "(?m)^AXVISOR_NVME_RW_PAYLOAD\\s*$",
  "(?m)^AXVISOR_NVME_ROOTFS_RW_PASSED\\s*$",
  # Host-side network subsystem init (enabled via the `net` feature on ax-std).
  "Initialize network subsystem",
  "use NIC 0:",
  # Management console runs on the primary CPU while vCPUs are pinned to Core 1.
  "shell task on CPU0",
]
shell_prefix = "axvisor:/$"
shell_init_cmd = """
echo AXVISOR_NVME_RW_PAYLOAD > /tmp/axvisor-nvme-rw
cat /tmp/axvisor-nvme-rw
rm -f /tmp/axvisor-nvme-rw
echo AXVISOR_NVME_ROOTFS_RW_PASSED
"""
to_bin = true
uefi = true
